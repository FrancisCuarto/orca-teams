name: Orca Teams CI

on:
  push:
    branches:
      - main
      - staging
      - develop
  pull_request:
    branches:
      - main
      - staging
      - develop

concurrency:
  group: orca-teams-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Teams Contracts & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          if [ -d node_modules/bun ]; then
            pnpm rebuild bun
          fi

      - name: Run Teams Unit Tests
        run: |
          pnpm run test src/renderer/src/components/team/kanban/team-kanban-board-mutations.test.ts src/shared/teamwork/team-workspace-types.test.ts src/shared/teamwork/team-database-service.test.ts src/shared/teamwork/team-invitation-service.test.ts src/shared/teamwork/realtime/team-crdt-board.test.ts src/renderer/src/components/team/hooks/use-team-kanban-sync.test.ts src/shared/teamwork/realtime/team-crdt-concurrency.test.ts src/shared/teamwork/team-agent-dispatch-service.test.ts src/renderer/src/components/team/kanban/TeamAgentExecutionModal.test.tsx src/renderer/src/components/team/kanban/team-kanban-agent-integration.test.tsx src/shared/teamwork/realtime/team-crdt-whiteboard.test.ts src/renderer/src/components/team/hooks/use-team-whiteboard-sync.test.ts src/renderer/src/components/team/whiteboard/TeamWhiteboardCursor.test.tsx src/shared/teamwork/realtime/team-crdt-notes.test.ts src/renderer/src/components/team/hooks/use-team-notes-sync.test.ts src/renderer/src/components/team/notes/TeamNotesView.test.tsx
